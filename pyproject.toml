[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-cli-ai"
version = "0.1.0"
description = "Hybrid AI Terminal Assistant - uses Groq Cloud when online, or a local Ollama model fully offline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "ollama>=0.1.0",
    "httpx>=0.24.0"
]

[tool.setuptools]
py-modules = ["cli", "utils", "ai_engine"]

[project.scripts]
ai = "cli:app"